server.port=${PORT:8080}

# MySQL Database (Tu dong dung TiDB Cloud tren Render, hoac localhost khi chay offline)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_classroom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Khoa xac thuc cho ESP32
app.device-key=esp32-secret-2026

# true = tu sinh du lieu gia lap cho phong A102
app.simulate=true
