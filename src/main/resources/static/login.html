<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập - Lớp học thông minh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eef1;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#12232e}
form{background:#fff;padding:36px 32px;width:min(360px,92vw);border-radius:6px;border-top:6px solid #0f6e8c;box-shadow:0 8px 30px rgba(18,35,46,.12)}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 22px;color:#566a77;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1.5px solid #c5d1d9;border-radius:4px;font:inherit}
input:focus{outline:3px solid #0f6e8c55;border-color:#0f6e8c}
button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:4px;background:#0f6e8c;color:#fff;font:600 15px inherit;cursor:pointer}
button:hover{background:#0b5870}.err{color:#c0392b;font-size:13px;margin-top:12px;display:none}
.hint{margin-top:18px;font-size:12px;color:#566a77}
</style></head><body>
<form method="post" action="/login">
<h1>Lớp học thông minh</h1><p>Đăng nhập để giám sát và điều khiển phòng học</p>
<label for="u">Tên đăng nhập</label><input id="u" name="username" autofocus required>
<label for="p">Mật khẩu</label><input id="p" name="password" type="password" required>
<button type="submit">Đăng nhập</button>
<div class="err" id="e">Sai tên đăng nhập hoặc mật khẩu.</div>
<div class="hint">Tài khoản mẫu: admin / admin123 &nbsp;·&nbsp; gv / gv123</div>
</form>
<script>if(location.search.includes('error'))document.getElementById('e').style.display='block'</script>
</body></html>
