<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Đăng nhập - SmartClass | Phòng học thông minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #172036;
      --navy-dark: #0f1624;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-soft: #e0f2fe;
      --accent-ring: rgb(2 132 199 / 0.20);
      --text: #1f2430;
      --text-muted: #5c6370;
      --text-subtle: #8a909b;
      --border: #e3e6ea;
      --border-strong: #cdd2d9;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-muted: #f7f8fa;
      --danger: #b93a3a;
      --danger-soft: #fae8e8;
      --radius: 10px;
      --radius-sm: 6px;
      --font-base: 'Source Sans Pro', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: var(--font-base);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 36px 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 1px 3px rgb(16 24 40 / 0.05), 0 8px 24px rgb(16 24 40 / 0.04);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      background: var(--accent);
      color: #ffffff;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .brand-info strong {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.2;
    }

    .brand-info small {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
    }

    .auth-card h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .auth-card > h1 + p {
      margin: 4px 0 20px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-error {
      margin-bottom: 18px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--danger-soft);
      border: 1px solid #f2c7c7;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 600;
      display: none;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-decoration: none;
    }

    .button.primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .button.primary:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .button.full-width {
      width: 100%;
      margin-top: 6px;
    }

    .footer-copy {
      margin-top: 24px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-subtle);
    }

    .footer-copy b {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <main class="auth-card">
    <div class="brand-header">
      <div class="brand-mark">S</div>
      <div class="brand-info">
        <strong>SmartClass</strong>
        <small>Phòng học thông minh 4.0</small>
      </div>
    </div>

    <h1>Đăng nhập</h1>
    <p>Sử dụng tài khoản được cấp để truy cập hệ thống quản trị và giám sát phòng học.</p>

    <div class="form-error" id="errBox" role="alert">
      Tên đăng nhập hoặc mật khẩu không chính xác. Vui lòng thử lại.
    </div>

    <form method="post" action="/login">
      <label class="form-field" for="username">
        Tên đăng nhập
        <input
          class="input"
          type="text"
          id="username"
          name="username"
          placeholder="Nhập tên tài khoản..."
          autofocus
          required
        >
      </label>

      <label class="form-field" for="password">
        Mật khẩu
        <input
          class="input"
          type="password"
          id="password"
          name="password"
          placeholder="Nhập mật khẩu..."
          required
        >
      </label>

      <button type="submit" class="button primary full-width">
        Đăng nhập
      </button>
    </form>
  </main>

  <footer class="footer-copy">
    Hệ thống Quản lý Phòng học Thông minh SmartClass 4.0 © 2026. Đơn vị thi công & phát triển: <b>NTP Tech</b>
  </footer>

  <script>
    if (window.location.search.includes('error')) {
      document.getElementById('errBox').style.display = 'block';
    }
  </script>
</body>
</html>
